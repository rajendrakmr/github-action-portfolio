name: Docker Build & Push 

on:
    push:
        branches: [rajendra] 
    workflow_dispatch:
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Docker Login
              uses: docker/login-action@v4
              with: 
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Docker build & push 
              uses: docker/build-push-action@v7
              with:
                contexts: .
                push: true
                tags: |
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:${{github.ref_name}}
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:latest
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:${{github.sha}}

